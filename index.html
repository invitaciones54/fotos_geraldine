<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XV Años - Geraldine</title>
    <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --rojo: #c0152a;
            --rojo-oscuro: #8b0a1a;
            --rojo-suave: #e8192f;
            --plateado: #c8cdd4;
            --plateado-claro: #e8eaed;
            --plateado-brillante: #f0f2f5;
            --dorado-palido: #d4af8a;
            --blanco: #ffffff;
            --blanco-crema: #fdf9f7;
            --texto-oscuro: #2a1a1a;
            --texto-medio: #6b5050;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #1a0810;
            background-image:
                radial-gradient(ellipse at 20% 10%, rgba(192, 21, 42, 0.25) 0%, transparent 55%),
                radial-gradient(ellipse at 80% 90%, rgba(139, 10, 26, 0.2) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 50%, rgba(26, 8, 16, 0) 0%, #1a0810 70%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px 16px 40px;
            overflow-x: hidden;
        }

        /* ── Partículas decorativas ── */
        .petal {
            position: fixed;
            width: 6px;
            height: 6px;
            background: radial-gradient(circle, rgba(192,21,42,0.7), rgba(139,10,26,0.2));
            border-radius: 50% 0 50% 0;
            pointer-events: none;
            animation: caer linear infinite;
            opacity: 0;
        }
        .petal:nth-child(1)  { left:8%;  animation-duration:12s; animation-delay:0s;   width:5px;  height:5px; }
        .petal:nth-child(2)  { left:22%; animation-duration:15s; animation-delay:2s;   width:4px;  height:4px; }
        .petal:nth-child(3)  { left:45%; animation-duration:10s; animation-delay:4s;   width:7px;  height:7px; }
        .petal:nth-child(4)  { left:68%; animation-duration:13s; animation-delay:1s;   width:4px;  height:4px; }
        .petal:nth-child(5)  { left:85%; animation-duration:16s; animation-delay:3s;   width:5px;  height:5px; }
        .petal:nth-child(6)  { left:30%; animation-duration:11s; animation-delay:6s;   width:6px;  height:6px; }
        .petal:nth-child(7)  { left:58%; animation-duration:14s; animation-delay:5s;   width:4px;  height:4px; }

        @keyframes caer {
            0%   { transform: translateY(-20px) rotate(0deg);   opacity: 0; }
            10%  { opacity: 0.7; }
            90%  { opacity: 0.4; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        /* ── Marco plateado exterior ── */
        .silver-frame {
            width: 100%;
            max-width: 400px;
            padding: 3px;
            border-radius: 22px;
            background: linear-gradient(135deg,
                #e8eaed 0%,
                #c8cdd4 20%,
                #f0f2f5 40%,
                #a0a8b0 60%,
                #d8dde2 80%,
                #e8eaed 100%);
            box-shadow:
                0 0 0 1px rgba(200,205,212,0.3),
                0 20px 60px rgba(0,0,0,0.7),
                0 0 40px rgba(192,21,42,0.15),
                inset 0 1px 0 rgba(255,255,255,0.4);
            animation: aparecer 1s ease forwards;
            opacity: 0;
        }

        @keyframes aparecer {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── Tarjeta principal ── */
        .card {
            background: linear-gradient(170deg,
                rgba(253,249,247,0.97) 0%,
                rgba(255,255,255,0.99) 50%,
                rgba(250,245,243,0.97) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Ornamento rojo superior */
        .card::before {
            content: '';
            display: block;
            height: 5px;
            background: linear-gradient(90deg,
                transparent 0%,
                var(--rojo-oscuro) 15%,
                var(--rojo) 40%,
                var(--rojo-suave) 50%,
                var(--rojo) 60%,
                var(--rojo-oscuro) 85%,
                transparent 100%);
        }

        /* ── Cabecera con rosas SVG ── */
        .card-header {
            padding: 22px 24px 0;
            text-align: center;
            position: relative;
        }

        .roses-svg {
            width: 100%;
            max-width: 320px;
            margin: 0 auto 4px;
            display: block;
            opacity: 0.92;
            animation: fadeUp 0.9s 0.3s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 0.92; transform: translateY(0); }
        }

        /* ── Número XV ── */
        .xv-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
            animation: fadeUp 0.9s 0.45s ease both;
        }

        .xv-line {
            width: 40px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--plateado), transparent);
        }

        .xv-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: 13px;
            letter-spacing: 6px;
            color: var(--plateado);
            font-style: italic;
            font-weight: 300;
        }

        /* ── Nombre principal ── */
        .name-script {
            font-family: 'Pinyon Script', cursive;
            font-size: 64px;
            line-height: 1.1;
            color: var(--rojo);
            text-shadow:
                0 2px 8px rgba(192,21,42,0.25),
                0 0 30px rgba(192,21,42,0.1);
            margin-bottom: 4px;
            animation: fadeUp 0.9s 0.6s ease both;
            display: block;
        }

        /* ── Contenedor foto ── */
        .photo-frame-wrap {
            padding: 0 24px;
            margin: 14px 0;
            animation: fadeUp 0.9s 0.75s ease both;
        }

        .photo-frame {
            width: 100%;
            aspect-ratio: 3/4;
            border-radius: 14px;
            padding: 3px;
            background: linear-gradient(135deg,
                #e8eaed 0%,
                #c8cdd4 25%,
                #f0f2f5 50%,
                #a0a8b0 75%,
                #d8dde2 100%);
            box-shadow:
                0 8px 32px rgba(0,0,0,0.18),
                0 2px 8px rgba(192,21,42,0.08),
                inset 0 1px 0 rgba(255,255,255,0.6);
            position: relative;
        }

        .photo-inner {
            width: 100%;
            height: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: linear-gradient(160deg,
                #f8eef0 0%,
                #f0e0e4 30%,
                #e8d0d5 60%,
                #ddc0c6 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Fondo sutil de rosas en el placeholder */
        .photo-inner::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(192,21,42,0.06) 30%, transparent 60%),
                radial-gradient(circle at 80% 70%, rgba(192,21,42,0.06) 30%, transparent 60%);
        }

        .photo-placeholder-icon {
            position: relative;
            z-index: 1;
        }

        .photo-placeholder-icon svg {
            width: 64px;
            height: 64px;
            opacity: 0.35;
        }

        .photo-placeholder-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: 13px;
            color: var(--texto-medio);
            margin-top: 10px;
            letter-spacing: 2px;
            font-style: italic;
            position: relative;
            z-index: 1;
        }

        /* Esquinas decorativas del marco */
        .photo-frame::before,
        .photo-frame::after,
        .photo-frame .corner-tl,
        .photo-frame .corner-br {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            border-color: rgba(255,255,255,0.8);
            border-style: solid;
            z-index: 2;
            border-radius: 2px;
        }
        .photo-frame::before { top: 7px; left: 7px;  border-width: 2px 0 0 2px; }
        .photo-frame::after  { top: 7px; right: 7px; border-width: 2px 2px 0 0; }
        .photo-frame .corner-tl { bottom: 7px; left: 7px;  border-width: 0 0 2px 2px; }
        .photo-frame .corner-br { bottom: 7px; right: 7px; border-width: 0 2px 2px 0; }

        /* ── Cuerpo de la tarjeta ── */
        .card-body {
            padding: 0 28px 28px;
            text-align: center;
        }

        .divider-ornament {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0 0 16px;
            animation: fadeUp 0.9s 0.9s ease both;
        }

        .div-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(192,21,42,0.3), transparent);
        }

        .div-diamond {
            width: 6px;
            height: 6px;
            background: var(--rojo);
            transform: rotate(45deg);
            opacity: 0.7;
        }

        .card-message {
            font-family: 'Cormorant Garamond', serif;
            font-size: 15px;
            line-height: 1.75;
            color: var(--texto-medio);
            font-style: italic;
            font-weight: 300;
            margin-bottom: 22px;
            animation: fadeUp 0.9s 1.05s ease both;
        }

        /* ── Botón principal ── */
        #upload_widget {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: linear-gradient(135deg, var(--rojo-oscuro) 0%, var(--rojo) 50%, var(--rojo-suave) 100%);
            color: var(--blanco);
            border: none;
            padding: 16px 28px;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 50px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow:
                0 6px 24px rgba(192,21,42,0.45),
                0 2px 8px rgba(0,0,0,0.2),
                inset 0 1px 0 rgba(255,255,255,0.15);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            animation: fadeUp 0.9s 1.2s ease both;
        }

        /* Brillo plateado en el botón */
        #upload_widget::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 60%;
            height: 100%;
            background: linear-gradient(90deg,
                transparent,
                rgba(255,255,255,0.2),
                transparent);
            transform: skewX(-20deg);
            animation: shimmer 3s 2s infinite;
        }

        @keyframes shimmer {
            0%   { left: -100%; }
            40%  { left: 130%; }
            100% { left: 130%; }
        }

        #upload_widget:active {
            transform: scale(0.97);
            box-shadow: 0 3px 12px rgba(192,21,42,0.35);
        }

        .btn-icon {
            font-size: 18px;
            line-height: 1;
        }

        /* ── Footer ── */
        .footer {
            margin-top: 20px;
            font-size: 11px;
            color: rgba(200,205,212,0.5);
            letter-spacing: 1px;
            text-align: center;
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
            animation: fadeUp 0.9s 1.35s ease both;
        }

        .footer span {
            color: rgba(192,21,42,0.6);
        }

        /* ── Ornamento inferior ── */
        .bottom-ornament {
            margin-top: 18px;
            text-align: center;
            animation: fadeUp 0.9s 1.5s ease both;
        }

        .bottom-ornament svg {
            width: 100px;
            opacity: 0.35;
        }
    </style>
</head>
<body>

    <!-- Pétalos flotantes -->
    <div class="petal"></div>
    <div class="petal"></div>
    <div class="petal"></div>
    <div class="petal"></div>
    <div class="petal"></div>
    <div class="petal"></div>
    <div class="petal"></div>

    <!-- Marco plateado -->
    <div class="silver-frame">
        <div class="card">

            <!-- Cabecera floral SVG -->
            <div class="card-header">
                <!-- Arreglo de rosas SVG -->
                <svg class="roses-svg" viewBox="0 0 320 90" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Tallo central -->
                    <path d="M160 88 C160 60, 155 45, 158 20" stroke="#5a2030" stroke-width="1.2" fill="none" opacity="0.6"/>
                    <!-- Hojas centrales -->
                    <path d="M158 55 C148 45, 140 48, 143 58 C148 55, 155 56, 158 55Z" fill="#5a3020" opacity="0.5"/>
                    <path d="M160 50 C170 40, 178 43, 175 53 C170 50, 163 51, 160 50Z" fill="#5a3020" opacity="0.5"/>

                    <!-- Rosa central grande -->
                    <circle cx="160" cy="18" r="12" fill="#a01020" opacity="0.15"/>
                    <path d="M160 6 C163 10, 167 12, 166 18 C165 22, 160 24, 155 22 C150 19, 150 13, 155 10 C157 8, 159 7, 160 6Z" fill="#c0152a" opacity="0.9"/>
                    <path d="M166 18 C168 22, 168 26, 164 27 C161 28, 157 26, 155 22 C159 23, 164 23, 166 18Z" fill="#a01020" opacity="0.8"/>
                    <path d="M155 10 C157 14, 158 18, 155 22 C152 20, 150 16, 150 13 C150 10, 152 8, 155 10Z" fill="#8b0a1a" opacity="0.7"/>
                    <circle cx="160" cy="16" r="4" fill="#e8192f" opacity="0.6"/>
                    <circle cx="160" cy="16" r="2" fill="#ff4060" opacity="0.5"/>

                    <!-- Tallo izquierdo -->
                    <path d="M120 88 C122 70, 118 55, 122 35" stroke="#5a2030" stroke-width="1" fill="none" opacity="0.5"/>
                    <path d="M121 60 C113 52, 106 55, 109 63 C113 60, 119 60, 121 60Z" fill="#5a3020" opacity="0.4"/>
                    <!-- Rosa izquierda -->
                    <path d="M122 25 C125 29, 129 30, 128 36 C127 40, 122 41, 118 38 C114 35, 115 29, 119 26 C120 24, 121 24, 122 25Z" fill="#c0152a" opacity="0.85"/>
                    <path d="M128 36 C130 40, 129 43, 126 44 C123 44, 119 42, 118 38 C121 39, 126 39, 128 36Z" fill="#a01020" opacity="0.75"/>
                    <circle cx="122" cy="33" r="3.5" fill="#e8192f" opacity="0.55"/>

                    <!-- Tallo derecho -->
                    <path d="M200 88 C198 70, 202 55, 198 35" stroke="#5a2030" stroke-width="1" fill="none" opacity="0.5"/>
                    <path d="M199 60 C207 52, 214 55, 211 63 C207 60, 201 60, 199 60Z" fill="#5a3020" opacity="0.4"/>
                    <!-- Rosa derecha -->
                    <path d="M198 25 C195 29, 191 30, 192 36 C193 40, 198 41, 202 38 C206 35, 205 29, 201 26 C200 24, 199 24, 198 25Z" fill="#c0152a" opacity="0.85"/>
                    <path d="M192 36 C190 40, 191 43, 194 44 C197 44, 201 42, 202 38 C199 39, 194 39, 192 36Z" fill="#a01020" opacity="0.75"/>
                    <circle cx="198" cy="33" r="3.5" fill="#e8192f" opacity="0.55"/>

                    <!-- Detalles pequeños -->
                    <path d="M140 75 C136 68, 130 70, 132 76 C135 74, 139 74, 140 75Z" fill="#5a3020" opacity="0.35"/>
                    <path d="M180 72 C184 65, 190 67, 188 73 C185 71, 181 71, 180 72Z" fill="#5a3020" opacity="0.35"/>
                    <!-- Capullos pequeños -->
                    <ellipse cx="138" cy="68" rx="4" ry="5" fill="#c0152a" opacity="0.5"/>
                    <ellipse cx="182" cy="65" rx="4" ry="5" fill="#c0152a" opacity="0.5"/>

                    <!-- Línea decorativa plateada -->
                    <line x1="30" y1="85" x2="290" y2="85" stroke="url(#silverLine)" stroke-width="0.8" opacity="0.5"/>
                    <defs>
                        <linearGradient id="silverLine" x1="0" y1="0" x2="1" y2="0">
                            <stop offset="0%"   stop-color="#c8cdd4" stop-opacity="0"/>
                            <stop offset="30%"  stop-color="#e8eaed" stop-opacity="1"/>
                            <stop offset="70%"  stop-color="#e8eaed" stop-opacity="1"/>
                            <stop offset="100%" stop-color="#c8cdd4" stop-opacity="0"/>
                        </linearGradient>
                    </defs>
                </svg>

                <!-- Insignia XV -->
                <div class="xv-badge">
                    <div class="xv-line"></div>
                    <span class="xv-text">MIS XV AÑOS</span>
                    <div class="xv-line"></div>
                </div>

                <!-- Nombre en script -->
                <span class="name-script">Geraldine</span>
            </div>

            <!-- Foto de la quinceañera -->
            <div class="photo-frame-wrap">
                <div class="photo-frame">
                    <div class="corner-tl"></div>
                    <div class="corner-br"></div>
                    <div class="photo-inner">
                        <div class="photo-placeholder-icon">
                            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <circle cx="32" cy="22" r="11" stroke="#c0152a" stroke-width="1.5" fill="rgba(192,21,42,0.08)"/>
                                <path d="M12 52 C12 38, 20 30, 32 30 C44 30, 52 38, 52 52" stroke="#c0152a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
                                <!-- Corona -->
                                <path d="M22 14 L26 8 L32 12 L38 8 L42 14" stroke="#c8cdd4" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                                <circle cx="22" cy="14" r="1.5" fill="#c8cdd4"/>
                                <circle cx="32" cy="12" r="1.5" fill="#c8cdd4"/>
                                <circle cx="42" cy="14" r="1.5" fill="#c8cdd4"/>
                            </svg>
                        </div>
                        <span class="photo-placeholder-text"></span>
                    </div>
                </div>
            </div>

            <!-- Cuerpo -->
            <div class="card-body">
                <div class="divider-ornament">
                    <div class="div-line"></div>
                    <div class="div-diamond"></div>
                    <div class="div-line"></div>
                </div>

                <p class="card-message">
                    Gracias por compartir conmigo este día tan mágico.<br>
                    Inmortaliza estos momentos y súbelos aquí,<br>para que juntos guardemos cada recuerdo.
                </p>

                <button id="upload_widget">
                    <span class="btn-icon">📸</span>
                    Subir Fotos &amp; Videos
                </button>

                <div class="bottom-ornament">
                    <svg viewBox="0 0 100 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <line x1="0" y1="10" x2="40" y2="10" stroke="url(#ornGrad)" stroke-width="0.8"/>
                        <path d="M46 10 L50 5 L54 10 L50 15Z" fill="#c0152a" opacity="0.5"/>
                        <line x1="60" y1="10" x2="100" y2="10" stroke="url(#ornGrad2)" stroke-width="0.8"/>
                        <defs>
                            <linearGradient id="ornGrad" x1="0" y1="0" x2="1" y2="0">
                                <stop offset="0%" stop-color="#c8cdd4" stop-opacity="0"/>
                                <stop offset="100%" stop-color="#c8cdd4" stop-opacity="0.8"/>
                            </linearGradient>
                            <linearGradient id="ornGrad2" x1="0" y1="0" x2="1" y2="0">
                                <stop offset="0%" stop-color="#c8cdd4" stop-opacity="0.8"/>
                                <stop offset="100%" stop-color="#c8cdd4" stop-opacity="0"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
            </div>

        </div><!-- /card -->
    </div><!-- /silver-frame -->

    <div class="footer">
        Desarrollado con <span>♥</span> para los XV de Geraldine
    </div>

    <!-- ═══════════════════════════════════════
         ZONA TÉCNICA — NO MODIFICAR
    ═══════════════════════════════════════ -->
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>

    <script type="text/javascript">
        var myWidget = cloudinary.createUploadWidget({
            cloudName: 'dwf9jiy08',
            uploadPreset: 'xv_años',
            sources: ['local', 'camera'],
            multiple: true,
            language: "es",
            text: {
                es: {
                    menu: { files: "Mis fotos", camera: "Cámara" },
                    local: { browse: "Seleccionar fotos", dd_instruction: "Selecciona tus fotos" },
                    queue: { title_uploading_with_counter: "Subiendo {{num}} archivos" }
                }
            }
        }, (error, result) => {
            if (!error && result && result.event === "success") {
                console.log('Imagen subida:', result.info);
            }
        });

        document.getElementById("upload_widget").addEventListener("click", function(){
            myWidget.open();
        }, false);
    </script>

</body>
</html>
